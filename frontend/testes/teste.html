<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex">
        <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark vh-100" style="width: 280px;">
            <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4 fw-semibold">Sidebar</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item dropdown">
                    <a href="#" class="nav-link active dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">Jogadores</a>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="#visao-geral">Titulares</a></li>
                    </ul>
                    <ul class="list-group list-group-flush mt-2" id="listaTitulares"></ul>
                </li>
                <li>
                    <a href="#" class="nav-link text-white">Dashboard</a>
                </li>
                <li>
                    <a href="#" class="nav-link text-white">Jogos</a>
                </li>
                <li>
                    <a href="#" class="nav-link text-white">Equipas</a>
                </li>
            </ul>
            <hr>
        </div>

        <main class="flex-grow-1 p-4">
            <div class="d-flex flex-wrap gap-2 mb-3">
                <button type="button" class="btn btn-primary" onclick="iniciarCronometro()">Iniciar</button>
                <button type="button" class="btn btn-secondary" onclick="pausarCronometro()">Pausar</button>
                <button type="button" class="btn btn-success" onclick="atualizarPeriodo()" id="btnPeriodo">Atualizar Período</button>
                <button type="button" class="btn btn-warning" onclick="voltarPeriodo()">Voltar Período</button>
            </div>
            <div id="tempo" class="fs-4 fw-bold">0</div>
            <div id="periodo" class="fs-5"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.1.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="teste.js"></script>
</body>
</html>
